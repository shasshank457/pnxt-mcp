name: PointNXT MCP CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      POINTNXT_BASE_URL: ${{ secrets.POINTNXT_BASE_URL }}
      POINTNXT_ACCESS_TOKEN: ${{ secrets.POINTNXT_ACCESS_TOKEN }}
      POINTNXT_REFRESH_TOKEN: ${{ secrets.POINTNXT_REFRESH_TOKEN }}
      POINTNXT_REFRESH_ENDPOINT: ${{ secrets.POINTNXT_REFRESH_ENDPOINT || '/auth/refresh' }}
      POINTNXT_TENANT_ID: ${{ secrets.POINTNXT_TENANT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt ruff

      - name: Configure ephemeral test session encryption
        shell: bash
        run: echo "MCP_SESSION_ENCRYPTION_KEY=$(python -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"

      - name: Run lint
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run Orders tests
        run: python test_orders.py

      - name: Run Products tests
        run: python test_products.py
