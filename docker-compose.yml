services:
  pnxt-mcp:
    build: .
    container_name: pnxt-mcp
    env_file:
      - .env
    environment:
      MCP_FORWARDED_ALLOW_IPS: "172.19.0.1"
      POINTNXT_SESSION_STORE_PATH: /var/lib/pnxt-mcp/pointnxt-sessions.sqlite3
    volumes:
      - pnxt-mcp-data:/var/lib/pnxt-mcp
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=5).close()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pnxt-mcp-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
